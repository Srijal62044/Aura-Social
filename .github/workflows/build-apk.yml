name: Build Aura Social APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Source: GitHub / Codespaces"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Verify Gradle Wrapper
        run: |
          ls -la gradlew
          ls -la gradle/wrapper
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Find generated APK
        if: always()
        run: find . -type f -name "*.apk" -print

      - name: Upload Aura Social APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Social-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
