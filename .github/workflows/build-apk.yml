name: Build Aura Social APK

on:
  push:
    branches:
      - main
      - master
      - "codespace-*"
      - "codespaces-*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4

      - name: Show build source (GitHub / Codespaces)
        run: |
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Workspace  : $GITHUB_WORKSPACE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        id: project
        run: |
          GRADLEW=$(find . -name gradlew | head -n 1)
          chmod +x "$GRADLEW"
          echo "dir=$(dirname "$GRADLEW")" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Social-Latest-APK
          path: |
            **/build/outputs/apk/debug/*.apk
